services:
  - type: web
    name: dataqx-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATAQX_CORS_ORIGINS
        sync: false
      - key: DATAQX_ENV
        value: production
      - key: DATAQX_MAX_UPLOAD_MB
        value: "200"
